name: Grammar Check
on:
  push:
    branches:
      - main
    paths:
      - '**.tex'

permissions:
  contents: write
  pull-requests: write

jobs:
  grammar-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          provider: ${{ vars.LLM_PROVIDER }}
          api-key: ${{ secrets.LLM_API_KEY }}
          tier: ${{ vars.LLM_TIER }}
